<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http: file:; media-src 'self' file: blob: https: http:; connect-src 'self' https: http:">
  <title>Desk Helper</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <button id="brand" data-title="Ayarlar ve Hakkında"><img src="logo.png" alt=""><span class="bt"><b>Desk Helper</b><small><span id="brandVer"></span> · ⚙</small></span></button>
    <button id="spaceBtn"></button>
    <div id="tabs"></div>
    <div class="spacer"></div>
    <div id="dock" data-title="Pencereyi ekrana yerleştir">
      <button data-dock="left" data-title="Sol yarı">◧</button>
      <button data-dock="right" data-title="Sağ yarı">◨</button>
      <button data-dock="right3" data-title="Sağ üçte bir">▕</button>
      <button data-dock="full" data-title="Tam ekran">▣</button>
    </div>
  </header>
  <nav id="bar">
    <button id="favBtn" class="sc fav" data-title="Favoriler (Ctrl+Space)"><span class="emo">⭐</span><span data-t="Favoriler">Favoriler</span></button>
    <span class="sep"></span>
    <div id="shortcuts"></div>
    <div class="spacer"></div>
    <div id="barRight">
      <button id="addTab" class="sc add" data-title="Yeni sekme (Ctrl+T)">＋ <span data-t="Sekme">Sekme</span></button>
      <button id="addSpace" class="sc add" data-title="Yeni çalışma alanı">＋ <span data-t="Çalışma alanı">Çalışma alanı</span></button>
      <button id="bell" class="sc" data-title="Bildirimler"></button>
    </div>
  </nav>
  <main id="stage"></main>
  <footer id="appbar">
    <button id="abLeft" class="ab-arrow" hidden>‹</button>
    <div id="abScroll"><div id="abTrack"></div></div>
    <button id="abRight" class="ab-arrow" hidden>›</button>
  </footer>
  <div id="cover"></div>
  <div id="dropHint"></div>
  <div id="modal" hidden></div>
  <script src="i18n.js"></script>
  <script src="modal.js"></script>
  <script src="menu.js"></script>
  <script src="app.js"></script>
</body>
</html>
